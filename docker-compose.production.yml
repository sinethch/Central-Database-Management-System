services:
  dbops-control-plane:
    image: ${IMAGE_NAME:?Set IMAGE_NAME to the published application image}:${IMAGE_TAG:-latest}
    container_name: dbops-control-plane
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MANAGEMENT_HOST: 0.0.0.0
      MANAGEMENT_PORT: 8080
      BACKUP_STORAGE_DIR: /var/backups
      SSH_KNOWN_HOSTS_PATH: /run/dbops/known_hosts
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backups_storage:/var/backups
      - type: bind
        source: ${SSH_KNOWN_HOSTS_PATH:-./ssh/known_hosts}
        target: /run/dbops/known_hosts
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  backups_storage:
    name: dbops_backups_storage
